name: Code Quality Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'
  PYTHONPATH: src:airflow/dags
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pip-audit pylint vulture

      - name: Run Pylint
        run: pylint src/ airflow/dags/ --exit-zero

      - name: Run Vulture (find dead code)
        run: vulture src/ airflow/dags/ --min-confidence 80 --exit-zero

      - name: Run Bandit security check
        run: |
          bandit -r src/ airflow/dags/ -f json -o bandit-report.json -lll
          bandit -r src/ airflow/dags/ -lll

      - name: Check dependencies for vulnerabilities
        run: pip-audit -r requirements.txt
        continue-on-error: true

      - name: Check for secrets
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}

      - name: Check for secrets (Push)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before != github.event.after
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.sha }}
        continue-on-error: true

