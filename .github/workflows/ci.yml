name: CI - Lint & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Check code formatting and lint with Ruff
        run: |
          # Use ruff for both formatting and linting (matches local ci.py)
          ruff format --check src/ airflow/dags/
          ruff check src/ airflow/dags/

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-mock

      - name: Run tests with pytest
        run: |
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=term || true
      
      - name: Test Transform and Load modules
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'src')
          from pipelines.transform.transformer import DataTransformer
          from pipelines.load.loader import DataLoader
          print('✅ Transform and Load modules imported successfully')
          "

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

  validate-dags:
    name: Validate Airflow DAGs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Airflow and dependencies
        run: |
          python -m pip install --upgrade pip
          # Airflow 3 is in development, using latest 2.x for validation if 3.x not on PyPI
          pip install "apache-airflow>=2.10.0"
          pip install -r requirements.txt

      - name: Validate DAGs
        run: |
          mkdir -p airflow/dags airflow/logs airflow/config airflow/plugins
          mkdir -p data/raw data/processed
          export PYTHONPATH=$PYTHONPATH:$(pwd)/src:$(pwd)/airflow/dags
          
          python -c "
          import sys
          import os
          import warnings
          warnings.filterwarnings('ignore')
          
          # Cấu hình môi trường Airflow tối thiểu
          airflow_home = os.path.abspath('airflow')
          os.environ['AIRFLOW_HOME'] = airflow_home
          os.environ['AIRFLOW__DATABASE__SQL_ALCHEMY_CONN'] = f'sqlite:///{airflow_home}/airflow.db'
          os.environ['AIRFLOW__CORE__LOAD_EXAMPLES'] = 'False'
          os.environ['AIRFLOW__CORE__DAGS_FOLDER'] = os.path.abspath('airflow/dags')
          
          # Đảm bảo các thư mục cần thiết tồn tại
          sys.path.insert(0, os.path.abspath('src'))
          sys.path.insert(0, os.path.abspath('airflow/dags'))
          
          print('✅ Validating DAG imports...')
          
          try:
              # Import DAG file để kiểm tra syntax và dependencies
              import tiki_crawl_products_v2.tiki_crawl_fast as dag_module
              
              # Kiểm tra DAG object tồn tại
              if hasattr(dag_module, 'dag'):
                  dag = dag_module.dag
                  print(f'✅ DAG found: {dag.dag_id}')
                  print(f'   Description: {dag.description}')
                  print(f'   Tasks: {len(dag.tasks)}')
              else:
                  print('❌ No dag object found in module')
                  sys.exit(1)
                  
          except Exception as e:
              print(f'❌ DAG validation failed: {e}')
              import traceback
              traceback.print_exc()
              sys.exit(1)
          
          print('✅ All DAG validations passed!')
          "


