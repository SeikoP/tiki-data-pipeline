name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'
  PYTHONPATH: src:airflow/dags
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Check format and lint
        run: |
          ruff format --check src/ airflow/dags/ scripts/ tests/
          ruff check src/ airflow/dags/ scripts/ tests/

  config:
    name: Config Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate settings and docs
        run: python scripts/config/sync_config_docs.py --check

  test:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-mock pytest-asyncio hypothesis

      - name: Run tests with pytest
        run: |
          pytest tests/ -m "not integration and not slow" --cov=src --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

  validate-dags:
    name: Airflow DAG Import
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Airflow and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "apache-airflow>=2.10.0"
          pip install -r requirements.txt

      - name: Validate DAG imports
        run: |
          mkdir -p airflow/dags airflow/logs airflow/config airflow/plugins
          mkdir -p data/raw data/processed
          
          python -c "
          import sys
          import os
          import warnings
          warnings.filterwarnings('ignore')
          
          # Cấu hình môi trường Airflow tối thiểu
          airflow_home = os.path.abspath('airflow')
          os.environ['AIRFLOW_HOME'] = airflow_home
          os.environ['AIRFLOW__DATABASE__SQL_ALCHEMY_CONN'] = f'sqlite:///{airflow_home}/airflow.db'
          os.environ['AIRFLOW__CORE__LOAD_EXAMPLES'] = 'False'
          os.environ['AIRFLOW__CORE__DAGS_FOLDER'] = os.path.abspath('airflow/dags')
          
          # Đảm bảo các thư mục cần thiết tồn tại
          sys.path.insert(0, os.path.abspath('src'))
          sys.path.insert(0, os.path.abspath('airflow/dags'))
          
          print('✅ Validating DAG imports...')
          
          try:
              # Import DAG file để kiểm tra syntax và dependencies
              import tiki_crawl_products_v2.tiki_crawl_fast as dag_module
              
              # Kiểm tra DAG object tồn tại
              if hasattr(dag_module, 'dag'):
                  dag = dag_module.dag
                  print(f'✅ DAG found: {dag.dag_id}')
                  print(f'   Description: {dag.description}')
                  print(f'   Tasks: {len(dag.tasks)}')
              else:
                  print('❌ No dag object found in module')
                  sys.exit(1)
                  
          except Exception as e:
              print(f'❌ DAG validation failed: {e}')
              import traceback
              traceback.print_exc()
              sys.exit(1)
          
          print('✅ All DAG validations passed!')
          "


