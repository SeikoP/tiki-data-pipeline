x-airflow-common:
  &airflow-common
  image: tiki-airflow
  build:
    context: .
    dockerfile: airflow/Dockerfile
  env_file:
    - .env
  environment:
    &airflow-common-env
    TZ: Asia/Ho_Chi_Minh
    PYTHONPATH: "/opt/airflow:/opt/airflow/src:/opt/airflow/dags:/home/airflow/.local/lib/python3.12/site-packages"
    AIRFLOW__CORE__TASK_RUNNER: "StandardTaskRunner"
    AIRFLOW__CORE__ALLOWED_DESERIALIZATION_CLASSES: ""
    AIRFLOW__CORE__INTERNAL_API_URL: "http://airflow-webserver:8080"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-webserver:8080/execution/"
    AIRFLOW__API_AUTH__JWT_SECRET: ${_AIRFLOW__API_AUTH__JWT_SECRET}
    AIRFLOW__CORE__SECRET_KEY: ${_AIRFLOW__CORE__SECRET_KEY}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__DATABASE_ACCESS_ISOLATION: 'false'
    AIRFLOW__CORE__PARALLELISM: 10
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: 5
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW__SCHEDULER__STANDALONE_DAG_PROCESSOR: 'false'
    AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: 300
    AIRFLOW__CORE__DAG_FILE_PROCESSOR_TIMEOUT: 300
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${_AIRFLOW_WWW_USER_USERNAME:-admin}:Admin
    AIRFLOW__CORE__LOGGING_LEVEL: "INFO"
    
    # Scheduler Tuning for Low Latency
    AIRFLOW__SCHEDULER__SCHEDULER_HEARTBEAT_SEC: 5
    AIRFLOW__SCHEDULER__PARSING_PROCESSES: 2
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: 10
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: 10
    AIRFLOW__SCHEDULER__JOB_HEARTBEAT_SEC: 5

  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - ./src:/opt/airflow/src:ro
    - ./airflow/logs:/opt/airflow/logs
    - ./data:/opt/airflow/data
    - ./airflow/config:/opt/airflow/config:ro
    - ./scripts:/opt/airflow/scripts:ro
    - ./airflow/setup:/opt/airflow/airflow/setup:ro
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      TZ: Asia/Ho_Chi_Minh
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
    ports:
      - "5432:5432"
    volumes:
      - postgres-shared-volume:/var/lib/postgresql/data
      - ./airflow/setup/init-airflow-db.sh:/docker-entrypoint-initdb.d/01-init-airflow-db.sh:ro
      - ./airflow/setup/init-crawl-db.sh:/docker-entrypoint-initdb.d/02-init-crawl-db.sh:ro
    command: >
      postgres
      -c shared_buffers=256MB
      -c work_mem=32MB
      -c max_connections=100
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    restart: unless-stopped
    networks:
      - backend

  redis:
    image: redis:7.2-alpine
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --save ""
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped
    networks:
      - backend

  airflow-webserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    restart: unless-stopped
    networks:
      - backend
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    hostname: airflow-scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check-latest-only --job-type SchedulerJob || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.5'
          memory: 1.5G
    restart: unless-stopped
    networks:
      - backend
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", "airflow triggerer --help > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped
    networks:
      - backend
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    user: root
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        echo "🚀 Starting Airflow initialization..."
        
        # Wait for postgres
        echo "⏳ Waiting for PostgreSQL..."
        max_attempts=30
        attempt=1
        while ! pg_isready -h postgres -U ${POSTGRES_USER} 2>/dev/null; do
          if (( attempt >= max_attempts )); then
            echo "❌ PostgreSQL failed to start"
            exit 1
          fi
          sleep 2
          ((attempt++))
        done
        echo "✅ PostgreSQL ready"

        # Wait for Redis
        echo "⏳ Waiting for Redis..."
        attempt=1
        while ! redis-cli -h redis ping > /dev/null 2>&1; do
          if (( attempt >= max_attempts )); then
            echo "❌ Redis failed to start"
            exit 1
          fi
          sleep 2
          ((attempt++))
        done
        echo "✅ Redis ready"

        # Fix permissions for data folder (Host volume permission fix)
        # 1000:0 is often the host user:group, 50000:0 is airflow:root
        # Ideally we make it writable by group 0 (root) because airflow GID is 0
        echo "🔧 Fixing data permissions..."
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/data || echo "Warning: chown failed"
        chmod -R 777 /opt/airflow/data || echo "Warning: chmod failed"

        # Create standard directories if missing
        mkdir -p /opt/airflow/logs /opt/airflow/plugins /opt/airflow/data
        
        echo "Updating Airflow DB..."
        airflow db migrate
        
        echo "Updating Pools and Variables (One-shot)..."
        if [ -f /opt/airflow/airflow/setup/setup_airflow.py ]; then
          python /opt/airflow/airflow/setup/setup_airflow.py || echo "⚠️ Setup script failed"
        else
          echo "⚠️ Setup script not found"
        fi
        
        echo "Creating admin user..."
        
        echo "Creating admin user (Skipped - Handled by Env/Auth Manager)..."
        
        echo "Checking Airflow version..."
        airflow version || { echo "❌ Airflow binary check failed"; exit 1; }

        echo "✅ Init Done."
    environment:
      <<: *airflow-common-env
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD}
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres-shared-volume:
