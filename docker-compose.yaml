x-airflow-common:
  &airflow-common
  image: tiki-airflow
  build:
    context: .
    dockerfile: airflow/Dockerfile
  env_file:
    - ${ENV_FILE_PATH:-.env}
  environment:
    &airflow-common-env
    TZ: Asia/Ho_Chi_Minh
    # Simplified PYTHONPATH for faster imports
    PYTHONPATH: "/opt/airflow/src:/opt/airflow/dags"
    
    AIRFLOW__CORE__INTERNAL_API_URL: "http://airflow-webserver:8080"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-webserver:8080/execution/"

  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - ./src:/opt/airflow/src:ro
    - ./airflow/logs:/opt/airflow/logs
    - ./data:/opt/airflow/data
    - ./airflow/config:/opt/airflow/config:ro
    - ./scripts:/opt/airflow/scripts:ro
    - ./airflow/setup:/opt/airflow/airflow/setup:ro
    - ./backups:/opt/airflow/backups
    - ./passwords.json:/opt/airflow/external/passwords.json
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    env_file:
      - ${ENV_FILE_PATH:-.env}
    environment:
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-shared-volume:/var/lib/postgresql/data
      - ./airflow/setup/init-airflow-db.sh:/docker-entrypoint-initdb.d/01-init-airflow-db.sh:ro
      - ./airflow/setup/init-crawl-db.sh:/docker-entrypoint-initdb.d/02-init-crawl-db.sh:ro
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c work_mem=32MB
      -c max_connections=50
      -c random_page_cost=1.1
      -c effective_io_concurrency=100
      -c wal_buffers=8MB
      -c min_wal_size=512MB
      -c max_wal_size=2GB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-airflow_user} -d $${POSTGRES_DB:-tiki}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          memory: 512M
    restart: unless-stopped
    networks:
      - backend

  redis:
    image: redis:7.2-alpine
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    env_file:
      - ${ENV_FILE_PATH:-.env}
    command:
      - sh
      - -c
      - >
        exec redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
        --save 60 1 --appendonly yes
        --requirepass "$${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD:?REDIS_PASSWORD is required}\" --no-auth-warning ping | grep PONG"]
      interval: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 128M
    restart: unless-stopped
    networks:
      - backend

  airflow-webserver:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        exec airflow api-server
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ui/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1.5G
        reservations:
          memory: 768M
    restart: unless-stopped
    networks:
      - backend
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        exec airflow scheduler
    hostname: airflow-scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '3.0'
          memory: 2G
        reservations:
          memory: 1G
    stop_grace_period: 30s
    restart: unless-stopped
    networks:
      - backend
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        exec airflow dag-processor
    hostname: airflow-dag-processor
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --local || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          memory: 512M
    stop_grace_period: 30s
    restart: unless-stopped
    networks:
      - backend
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/airflow-triggerer-ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow triggerer &
        TRIGGERER_PID=$$!
        sleep 10
        touch /tmp/airflow-triggerer-ready
        wait $$TRIGGERER_PID
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M
        reservations:
          memory: 192M
    restart: unless-stopped
    networks:
      - backend
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    user: root
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        echo "🚀 Starting Airflow initialization..."
        
        # Wait for postgres
        echo "⏳ Waiting for PostgreSQL..."
        max_attempts=30
        attempt=1
        while ! pg_isready -h postgres -U "$${POSTGRES_USER:-airflow_user}" 2>/dev/null; do
          if (( attempt >= max_attempts )); then
            echo "❌ PostgreSQL failed to start"
            exit 1
          fi
          sleep 2
          ((attempt++))
        done
        echo "✅ PostgreSQL ready"

        # Wait for Redis
        echo "⏳ Waiting for Redis..."
        attempt=1
        while ! redis-cli -h redis -a "$${REDIS_PASSWORD:?REDIS_PASSWORD is required}" --no-auth-warning ping > /dev/null 2>&1; do
          if (( attempt >= max_attempts )); then
            echo "❌ Redis failed to start"
            exit 1
          fi
          sleep 2
          ((attempt++))
        done
        echo "✅ Redis ready"

        # Fix permissions
        echo "🔧 Fixing data permissions..."
        chown -R "$${AIRFLOW_UID:-50000}:0" /opt/airflow/data || echo "Warning: chown failed"
        chmod -R 775 /opt/airflow/data || echo "Warning: chmod failed"

        # Create directories
        mkdir -p /opt/airflow/logs /opt/airflow/plugins /opt/airflow/data
        
        echo "Updating Airflow DB..."
        su airflow -c "airflow db migrate"
        
        echo "Updating Pools and Variables..."
        if [ -f /opt/airflow/airflow/setup/setup_airflow.py ]; then
          su airflow -c "python /opt/airflow/airflow/setup/setup_airflow.py"
          if [ $$? -ne 0 ]; then
            echo "❌ Setup script failed - pools and variables not created"
            exit 1
          fi
          echo "✅ Pools and variables created successfully"
        else
          echo "❌ Setup script not found at /opt/airflow/airflow/setup/setup_airflow.py"
          exit 1
        fi
        
        echo "Checking Airflow version..."
        su airflow -c "airflow version" || { echo "❌ Airflow binary check failed"; exit 1; }

        echo "✅ Init Done."
    environment:
      <<: *airflow-common-env
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres-shared-volume:
  redis-data:
